name: Build & Distribute

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check version numbers agree
        run: |
          header=$(sed -nE 's/^ \* Version:[[:space:]]+([^[:space:]]+).*/\1/p' a11yfleet.php)
          constant=$(sed -nE "s/^define\( 'A11YFLEET_VERSION', '([^']+)' \);/\1/p" a11yfleet.php)
          stable=$(sed -nE 's/^Stable tag:[[:space:]]+([^[:space:]]+).*/\1/p' readme.txt)
          echo "Plugin header: $header, A11YFLEET_VERSION: $constant, readme Stable tag: $stable"

          status=0
          if [ -z "$header" ] || [ "$header" != "$constant" ] || [ "$header" != "$stable" ]; then
            echo "::error::Version mismatch: plugin header $header, A11YFLEET_VERSION $constant, readme Stable tag $stable."
            status=1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$header" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match plugin version $header. Bump the version or tag v$header."
            status=1
          fi

          exit $status

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build admin assets
        run: |
          npm ci
          npm run build

      - name: Build zip
        run: bash bin/build-zip.sh

      - name: Run Plugin Check on the package
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/a11yfleet
          slug: a11yfleet

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: a11yfleet
          path: dist/a11yfleet.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/a11yfleet.zip

      # Publishes the exact package Plugin Check just passed to SVN trunk/ and
      # tags/<version>/ (version = tag without the leading v), and syncs
      # .wordpress-org/ to SVN assets/.
      - name: Deploy to WordPress.org
        if: startsWith(github.ref, 'refs/tags/')
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: a11yfleet
          BUILD_DIR: dist/a11yfleet
